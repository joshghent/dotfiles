    flatpak:
      - com.discordapp.Discord
      - com.slack.Slack
      - app.zen_browser.zen
      - org.signal.Signal
      - com.spotify.Client
      - org.mozilla.firefox
      - com.obsproject.Studio
      - org.libreoffice.LibreOffice
      - com.calibre_ebook.calibre
      - org.chromium.Chromium
      - com.onepassword.OnePassword
      - com.dropbox.Client
      - com.protonvpn.www
      - ch.protonmail.protonmail-bridge
      - dev.zed.Zed
      - io.jan.Jan

    # Ubuntu/Debian servers (headless). SYSTEM packages only — things that
    # genuinely need root. The rest of the CLI toolset (ripgrep, fd, bat, fzf,
    # jq, gh, neovim, lazygit, delta, …) is installed per-user via mise (see
    # dot_config/mise/config.toml), so a box where you have no sudo still gets
    # a full toolset. Each install is best-effort (`|| continue`).
    apt:
      # Shells / multiplexers / small system utilities not in mise
      - git
      - fish
      - tmux
      - tree
      - htop
      - nmap
      - autojump

      # Build toolchain (for native builds; language runtimes come from mise)
      - build-essential
      - cmake
      - pkg-config

      # GnuPG / secrets (headless pinentry, not the GUI one)
      - gnupg
      - pinentry-curses
      - pass

      # Containers
      - podman
      - buildah
      - skopeo

      # Networking
      - wireguard-tools

      # Misc
      - unzip
