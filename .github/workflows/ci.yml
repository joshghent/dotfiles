name: CI

on: push

jobs:
  test:
    name: make test and run pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.x"
      - name: Install shellcheck and fish
        run: sudo apt-get update && sudo apt-get install -y shellcheck fish
      # Templates have to be rendered before shellcheck can read them, so the
      # lint needs chezmoi itself. Pinned to match the version in use locally.
      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin -t v2.70.4
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files
      - name: make test
        run: make test
        shell: bash
